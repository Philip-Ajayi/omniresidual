version: '3.8'

services:
  omniresidual-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omniresidual_studio
    ports:
      - "8501:8501"
    environment:
      - TELEMETRY_FREQ_HZ=50
      - SYSID_PARALLEL_ENVS=16
      - SYSID_MAX_ITERATIONS=25
      - ANOMALY_THRESHOLD_NM=3.5
      
      # NVIDIA NIM Settings
      # For NVIDIA Hosted Cloud NIM:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_NIM_BASE_URL=https://integrate.api.nvidia.com/v1
      - NVIDIA_NIM_MODEL=nvidia/llama-3.1-nemotron-70b-instruct

      # If using a self-hosted on-prem NIM container on your local GPU:
      # - NVIDIA_NIM_BASE_URL=http://host.docker.internal:8000/v1
      # - NVIDIA_NIM_MODEL=meta/llama-3.1-70b-instruct
    restart: unless-stopped